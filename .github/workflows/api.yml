name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - "packages/shared/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - "packages/shared/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/database db:generate

      - run: pnpm --filter @taskflow/api format:check
      - run: pnpm --filter @taskflow/api lint
      - run: pnpm --filter @taskflow/api typecheck

      # Runs both the "unit" (mocked @taskflow/database) and "integration"
      # (Testcontainers postgres:18, see tests/integration/setup/global-setup.ts)
      # vitest projects - the integration project starts its own container,
      # no Postgres service block needed on this runner.
      - run: pnpm --filter @taskflow/api test:coverage

      - run: pnpm --filter @taskflow/api build

  # Validates apps/api/Dockerfile's `runner` target still builds, and on
  # main publishes it to GHCR - zero extra secrets needed, GITHUB_TOKEN
  # already has packages:write via the permissions block below.
  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-api:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
