name: Scheduled DB cleanup

# Deployment-agnostic on purpose: this workflow only needs network access to
# the production Postgres instance via DATABASE_URL - it doesn't care where
# apps/web or apps/api are actually hosted (Railway, Vercel, Fly.io, ...).
# Runs the @taskflow/database cleanup scripts that exist and are tested but,
# before this workflow, had nothing invoking them:
#   - cleanup:abandoned-registrations: deletes unverified User rows (and
#     their cascaded AuthTokens) past the abandoned-signup TTL.
#   - cleanup:expired-rate-limits: deletes expired RateLimitBucket rows.
#   - cleanup:stale-invitations: deletes PENDING Invitation rows that expired
#     more than STALE_INVITATION_GRACE_DAYS ago.
# Without a scheduler, all three tables grow unbounded in any real deployment.
on:
  schedule:
    - cron: "0 4 * * *" # once daily, 04:00 UTC
  workflow_dispatch: {} # manual trigger for on-demand runs / verification

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # prisma.config.ts resolves DATABASE_URL at config-load time, so even
    # `prisma generate` needs it - job-level (not scoped to one step) since
    # every step here, unlike a CI build, talks to the real database anyway.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/database db:generate

      - name: Delete abandoned (never-verified) registrations
        run: pnpm --filter @taskflow/database cleanup:abandoned-registrations

      - name: Delete expired rate-limit buckets
        run: pnpm --filter @taskflow/database cleanup:expired-rate-limits

      - name: Delete stale (long-expired) invitations
        run: pnpm --filter @taskflow/database cleanup:stale-invitations
