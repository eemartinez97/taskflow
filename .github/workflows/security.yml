name: security

# Secret scanning across full git history on every push/PR. Not one of the
# TDD's five named per-package workflows (web/api/shared/database/
# compose-smoke) - kept as an additive gate, split out on its own so a leak
# anywhere in the repo fails fast without waiting on the slower per-package
# pipelines.
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
