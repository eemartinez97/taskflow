name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/mail/**"
      - "packages/shared/**"
      - "packages/database/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/mail/**"
      - "packages/shared/**"
      - "packages/database/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"

# Build-time placeholders only - satisfy apps/web's Zod env schemas (see
# lib/env.server.ts / lib/env.client.ts) well enough for `next build`'s
# page-data-collection step to import every route module, and for the RSC
# tRPC caller to import apps/api's own env.ts. Mirrors the values already
# documented in .env.example / apps/web/Dockerfile's build-stage ARGs -
# never real secrets.
env:
  DATABASE_URL: "postgresql://build:build@localhost:5432/build?schema=taskflow"
  NEXTAUTH_SECRET: "ci-build-time-placeholder-not-a-real-secret"
  NEXTAUTH_URL: "http://localhost:3000"
  RESEND_API_KEY: "re_ci_build_time_placeholder"
  EMAIL_FROM: "TaskFlow <noreply@example.com>"
  NEXT_PUBLIC_API_URL: "http://localhost:8000"
  NEXT_PUBLIC_WEB_URL: "http://localhost:3000"
  TRUSTED_PROXY_HOPS: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/database db:generate

      - run: pnpm --filter @taskflow/web format:check
      - run: pnpm --filter @taskflow/web lint
      - run: pnpm --filter @taskflow/web typecheck
      - run: pnpm --filter @taskflow/web test:coverage
      - run: pnpm --filter @taskflow/web build

  # apps/web/playwright.config.ts is self-contained - its own `webServer`
  # entries boot `pnpm --filter @taskflow/api dev` and a production
  # `next build && next start`, so the only extra infra this job needs is a
  # real reachable Postgres for both of those to connect to.
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=taskflow"
      NEXTAUTH_SECRET: "e2e-not-a-real-secret-16-chars-min"
      NEXTAUTH_URL: "http://localhost:3000"
      RESEND_API_KEY: "re_e2e_placeholder"
      EMAIL_FROM: "TaskFlow <noreply@example.com>"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_WEB_URL: "http://localhost:3000"
      TRUSTED_PROXY_HOPS: "1"
      WEB_ORIGIN: "http://localhost:3000"
      API_PORT: "8000"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/database db:generate

      - name: Apply migrations
        run: pnpm --filter @taskflow/database db:migrate:deploy

      - name: Seed the E2E user (admin@taskflow.dev)
        run: pnpm --filter @taskflow/database db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @taskflow/web exec playwright install --with-deps chromium firefox

      - run: pnpm --filter @taskflow/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Validates apps/web/Dockerfile's `runner` target still builds (Docker's
  # own ARG defaults cover the build-time placeholders above), and on main
  # publishes it to GHCR.
  image:
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-web:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
