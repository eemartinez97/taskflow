# Every alert (infrastructure/prometheus/alert-rules.yml) routes to
# `default-receiver`, which has NO notification integration configured -
# alerts are visible in Alertmanager's own UI/API (http://localhost/alertmanager/)
# but nothing actually pages/messages anyone yet. No real webhook/API
# credentials (Slack, PagerDuty, email, ...) exist in this repo to wire one
# up for real - see BACKLOG.md.
#
# To wire a real channel once you have credentials, add a `slack_configs:`
# (or `email_configs:`, `webhook_configs:`, etc.) block under
# `default-receiver` below - see
# https://prometheus.io/docs/alerting/latest/configuration/#receiver.
# Example (commented out):
#
# receivers:
#   - name: default-receiver
#     slack_configs:
#       - api_url: "https://hooks.slack.com/services/REPLACE/ME/WITH_A_REAL_WEBHOOK"
#         channel: "#taskflow-alerts"
#         send_resolved: true

route:
  receiver: default-receiver
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default-receiver
