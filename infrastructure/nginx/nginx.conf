worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript
                text/xml application/xml application/xml+rss text/javascript;

  client_max_body_size 10m;

  # Engine.IO polling upgrades to a WebSocket - only set the Upgrade header
  # when the client actually asked for one, so plain polling requests don't
  # get an empty "Connection: " header.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream api_upstream {
    server api:8000;
    keepalive 16;
  }

  upstream web_upstream {
    server web:3000;
    keepalive 16;
  }

  upstream grafana_upstream {
    server grafana:3000;
    keepalive 4;
  }

  upstream alertmanager_upstream {
    server alertmanager:9093;
    keepalive 4;
  }

  server {
    listen 80;

    # apps/web/proxy.ts builds redirect URLs from the incoming request, and
    # apps/web's TRUSTED_PROXY_HOPS / apps/api's TRUSTED_PROXY_HOPS both
    # expect exactly one trusted hop's worth of X-Forwarded-For - this is
    # that hop (see .env.example).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # This list must stay in sync with apps/api/src/app.ts's registered
    # top-level routes - apps/api/tests/unit/app.test.ts asserts that
    # every route Express actually serves is one of these five, so an
    # out-of-sync nginx.conf fails CI instead of silently 404ing in prod.
    # No trailing slash: Express's app.use("/trpc", ...) mount (and a bare
    # GET/curl to exactly /trpc, no trailing slash) both match here too, not
    # just /trpc/*.
    location /trpc {
      proxy_pass http://api_upstream;
    }

    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
    }

    location = /healthz {
      proxy_pass http://api_upstream;
    }

    location = /readyz {
      proxy_pass http://api_upstream;
    }

    location = /metrics {
      proxy_pass http://api_upstream;
    }

    # E2E-only backdoor routes - see apps/api/src/routes/test.ts. Always
    # 404s per-request unless isAuthorizedE2ERequest() passes.
    location /api/test {
      proxy_pass http://api_upstream;
    }

    # Grafana (infrastructure/grafana/) - not an apps/api route, so it's
    # exempted in apps/api/tests/unit/infra/nginx-route-sync.test.ts the same
    # way /socket.io is. Routed through here rather than publishing grafana's
    # own port directly, so it gets the same TLS/routing posture as
    # everything else instead of being its own directly-exposed edge - see
    # docker-compose.yml's grafana service and README.md's "Out of scope"
    # note on what this does and doesn't cover.
    location /grafana/ {
      proxy_pass http://grafana_upstream/grafana/;
      proxy_http_version 1.1;
      # A location block that sets ANY proxy_set_header stops inheriting
      # ALL of them from the server{} block above (nginx doesn't merge -
      # it's all-or-nothing per context) - without these four, Grafana saw
      # no Host header at all and its origin/CSRF check rejected every
      # login as "origin not allowed", even though GF_SERVER_ROOT_URL was
      # correctly set.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Grafana Live (its own WebSocket feature) - harmless to include even
      # if nothing here uses it yet.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Alertmanager (infrastructure/alertmanager/) - same "not an apps/api
    # route, exempted in nginx-route-sync.test.ts" treatment as /grafana.
    # UNLIKE Grafana, Alertmanager has no login of its own - without
    # auth_basic here, anyone who can reach this host could view alert
    # history or silence alerts with zero authentication. The .htpasswd file
    # is generated at container startup from ALERTMANAGER_ADMIN_PASSWORD -
    # see docker-compose.yml's nginx service `command`.
    location /alertmanager/ {
      auth_basic "Alertmanager";
      auth_basic_user_file /etc/nginx/.htpasswd;
      proxy_pass http://alertmanager_upstream/alertmanager/;
      # See /grafana/'s comment above - same inheritance gotcha.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else - including apps/web's own /api/auth/[...nextauth]
    # and /api/health, and every page - goes to web.
    location / {
      proxy_pass http://web_upstream;
    }
  }
}
